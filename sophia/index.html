<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Sophia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300D632'/><text x='50' y='72' font-size='65' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>$</text></svg>" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; font-family:'DM Sans',sans-serif; background:#000; overscroll-behavior:none; }

#step1-wrapper { min-height:100dvh; display:flex; flex-direction:column; background:#00C851; }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 18px 0; }
.topbar-name { font-size:17px; font-weight:700; color:#000; letter-spacing:-0.3px; }
.topbar-avatar { width:36px; height:36px; background:rgba(0,0,0,0.18); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; color:#000; }

.amount-display { flex:1; display:flex; align-items:flex-start; justify-content:center; padding:10px 0 6px; }
.amount-inner { display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }

.method-strip { width:100%; padding:0 24px; }
.method-inner { width:100%; max-width:360px; background:#000; border-radius:18px; padding:6px; display:flex; gap:4px; margin:0 auto; }
.method-pill { flex:1; border-radius:13px; padding:10px 4px 6px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; opacity:0.85; cursor:pointer; transition:background 0.15s, opacity 0.15s; border:none; background:none; font-family:'DM Sans',sans-serif; }
.method-pill span.title { font-size:12px; font-weight:700; }
.method-pill span.sub { font-size:10px; opacity:0.7; }
.method-pill.active { background:#00C851; color:#000; opacity:1; }

.amount-text { font-size:72px; font-weight:800; color:#000; letter-spacing:-3px; line-height:1; word-break:break-all; text-align:center; padding:0 10px; }

.keypad-section { padding:0 24px 10px; }
.keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:0; margin-bottom:10px; max-width:400px; margin-left:auto; margin-right:auto; }
.key { background:none; border:none; font-size:32px; font-weight:400; color:#000; padding:14px 0; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:'DM Sans',sans-serif; transition:opacity 0.1s; user-select:none; }
.key:active { opacity:0.4; }
.key-backspace { font-size:24px; font-weight:600; }

.quick-section { padding:0 12px 10px; max-width:400px; margin:0 auto; width:100%; }
.quick-amounts { display:none; flex-wrap:wrap; gap:8px; justify-content:center; padding:0 6px 10px; }
.quick-amounts.visible { display:flex; }
.quick-chip { background:rgba(0,0,0,0.12); border:none; border-radius:999px; padding:9px 16px; font-size:15px; font-weight:600; color:#000; cursor:pointer; font-family:'DM Sans',sans-serif; transition:background 0.15s; }
.quick-chip:active { background:rgba(0,0,0,0.25); }
.quick-chip.selected { background:#000; color:#00C851; }
.quick-toggle-btn { width:100%; background:rgba(0,0,0,0.12); border:none; border-radius:14px; padding:14px; font-size:16px; font-weight:600; color:#000; cursor:pointer; font-family:'DM Sans',sans-serif; margin-bottom:10px; transition:background 0.15s; }
.quick-toggle-btn:active { background:rgba(0,0,0,0.22); }

.pay-section { padding:0 12px 12px; max-width:400px; margin:0 auto; width:100%; }
.pay-btn { width:100%; background:#000; color:#fff; border:none; border-radius:14px; padding:17px; font-size:17px; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; letter-spacing:0.2px; transition:opacity 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; }
.pay-btn:active { opacity:0.75; }
.pay-btn:disabled { opacity:0.5; cursor:not-allowed; }

.bottom-nav { display:flex; align-items:center; justify-content:space-between; padding:10px 40px 20px; background:#00C851; }
.bnav-item { display:flex; flex-direction:column; align-items:center; gap:2px; color:#000; font-size:11px; font-weight:600; cursor:pointer; background:none; border:none; font-family:'DM Sans',sans-serif; }
.bnav-amount { font-size:14px; font-weight:700; color:#000; }
.bnav-dollar { width:44px; height:44px; background:#00a040; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:900; color:#fff; box-shadow:0 2px 12px rgba(0,0,0,0.2); }
.bnav-clock { width:28px; height:28px; border:2.5px solid rgba(0,0,0,0.5); border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; }
.bnav-clock::after { content:''; position:absolute; width:2px; height:7px; background:#000; top:4px; left:50%; transform:translateX(-50%); border-radius:1px; }
.bnav-clock::before { content:''; position:absolute; width:6px; height:2px; background:#000; top:50%; left:50%; transform:translateY(-50%); border-radius:1px; }

.loading-overlay { display:none; position:fixed; inset:0; background:rgba(0,200,81,0.95); z-index:100; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
.loading-overlay.visible { display:flex; }
.spinner { width:48px; height:48px; border:4px solid rgba(0,0,0,0.15); border-top-color:#000; border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-text { font-size:16px; font-weight:700; color:#000; }
</style>
</head>
<body>

<div id="step1-wrapper">
  <div class="topbar">
    <div class="topbar-name">Sophia</div>
    <div class="topbar-avatar">S</div>
  </div>

  <div class="amount-display">
    <div class="amount-inner">
      <div class="method-strip">
        <div class="method-inner">
          <button class="method-pill active" data-method="lightning" onclick="selectMethod('lightning')">
            <span class="title">Lightning</span>
            <span class="sub">Instant</span>
          </button>
          <button class="method-pill" data-method="onchain" onclick="selectMethod('onchain')">
            <span class="title">On-Chain</span>
            <span class="sub">~60 min</span>
          </button>
          <button class="method-pill" data-method="usdc" onclick="selectMethod('usdc')">
            <span class="title">Cash App</span>
            <span class="sub">USDC · Fast</span>
          </button>
        </div>
      </div>
      <div class="amount-text" id="amountDisplay">$0</div>
    </div>
  </div>

  <div class="keypad-section">
    <div class="keypad">
      <button class="key" onclick="keyPress('1')">1</button>
      <button class="key" onclick="keyPress('2')">2</button>
      <button class="key" onclick="keyPress('3')">3</button>
      <button class="key" onclick="keyPress('4')">4</button>
      <button class="key" onclick="keyPress('5')">5</button>
      <button class="key" onclick="keyPress('6')">6</button>
      <button class="key" onclick="keyPress('7')">7</button>
      <button class="key" onclick="keyPress('8')">8</button>
      <button class="key" onclick="keyPress('9')">9</button>
      <button class="key" onclick="keyPress('.')">.</button>
      <button class="key" onclick="keyPress('0')">0</button>
      <button class="key key-backspace" onclick="keyPress('back')">⌫</button>
    </div>
  </div>

  <div class="quick-section">
    <div class="quick-amounts" id="quickAmounts">
      <button class="quick-chip" onclick="setQuick(this,10)">$10</button>
      <button class="quick-chip" onclick="setQuick(this,15)">$15</button>
      <button class="quick-chip" onclick="setQuick(this,20)">$20</button>
      <button class="quick-chip" onclick="setQuick(this,25)">$25</button>
      <button class="quick-chip" onclick="setQuick(this,50)">$50</button>
      <button class="quick-chip" onclick="setQuick(this,75)">$75</button>
      <button class="quick-chip" onclick="setQuick(this,100)">$100</button>
      <button class="quick-chip" onclick="setQuick(this,150)">$150</button>
      <button class="quick-chip" onclick="setQuick(this,200)">$200</button>
    </div>
    <button class="quick-toggle-btn" onclick="toggleQuick()">Quick amount</button>
  </div>

  <div class="pay-section">
    <button class="pay-btn" id="payBtn" onclick="submitPayment()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      Pay
    </button>
  </div>

  <div class="bottom-nav">
    <button class="bnav-item">
      <span class="bnav-amount" id="navAmount">$0</span>
    </button>
    <button class="bnav-item">
      <div class="bnav-dollar">$</div>
    </button>
    <button class="bnav-item">
      <div class="bnav-clock"></div>
    </button>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Generating Invoice…</div>
  </div>
</div>

<script>
const SUPABASE_URL      = 'https://qhyimqvuzzanekcqaemg.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoeWltcXZ1enphbmVrY3FhZW1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyODQ0NTgsImV4cCI6MjA5Nzg2MDQ1OH0.9_N1k4KhmK0Q9biy1SBOo6bvHsZEbTsyaPLz1t1k-R0';
const CREATE_USDC_URL   = `${SUPABASE_URL}/functions/v1/create-usdc-payment`;
const BTCPAY_URL        = `${SUPABASE_URL}/functions/v1/btcpay-webhook`;
const USDC_SECONDS      = 15 * 60;
const BTC_SECONDS       = 60 * 60;

let rawInput       = '';
let quickVisible   = false;
let selectedMethod = 'lightning'; // Default updated here

function selectMethod(method) {
  selectedMethod = method;
  document.querySelectorAll('.method-pill').forEach(pill => {
    pill.classList.toggle('active', pill.dataset.method === method);
  });
}

function formatDisplay(raw) {
  if (!raw || raw === '') return '$0';
  if (raw === '.') return '$0.';
  const parts   = raw.split('.');
  const intPart = parseInt(parts[0] || '0', 10);
  let result    = '$' + intPart;
  if (parts.length > 1) result += '.' + parts[1];
  return result;
}

function getNumericValue() {
  if (!rawInput || rawInput === '.') return 0;
  return parseFloat(rawInput) || 0;
}

function updateDisplay() {
    const val = getNumericValue();
    document.getElementById('amountDisplay').textContent = formatDisplay(rawInput);
    document.getElementById('navAmount').textContent = val > 0 ? '$' + val.toFixed(2) : '$0';
}

function keyPress(k) {
  if (k === 'back') {
    rawInput = rawInput.slice(0, -1);
    document.querySelectorAll('.quick-chip').forEach(c => c.classList.remove('selected'));
    updateDisplay();
    return;
  }
  if (k === '.') {
    if (rawInput.includes('.')) return;
    rawInput += '.';
    updateDisplay();
    return;
  }
  if (rawInput.includes('.')) {
    const dec = rawInput.split('.')[1];
    if (dec && dec.length >= 2) return;
  }
  if (getNumericValue() >= 2000) return;
  rawInput += k;
  document.querySelectorAll('.quick-chip').forEach(c => c.classList.remove('selected'));
  updateDisplay();
}

function setQuick(btn, amt) {
  document.querySelectorAll('.quick-chip').forEach(c => c.classList.remove('selected'));
  btn.classList.add('selected');
  rawInput = String(amt);
  updateDisplay();
}

function toggleQuick() {
  quickVisible = !quickVisible;
  const el = document.getElementById('quickAmounts');
  quickVisible ? el.classList.add('visible') : el.classList.remove('visible');
}

function getUserKey() {
  let k = sessionStorage.getItem('pv_user_key');
  if (k) return k;
  k = crypto.randomUUID
    ? crypto.randomUUID()
    : `pv-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
  sessionStorage.setItem('pv_user_key', k);
  return k;
}

function showLoading(text = 'Generating Invoice…') {
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingOverlay').classList.add('visible');
  document.getElementById('payBtn').disabled = true;
}

function hideLoading() {
  document.getElementById('loadingOverlay').classList.remove('visible');
  document.getElementById('payBtn').disabled = false;
}

async function submitPayment() {
  const amount = getNumericValue();
  if (!amount || amount < 2) {
    alert('Please enter an amount (min $2)');
    return;
  }

  showLoading('Generating Invoice…');

  try {
    let city = '', country = '';
    try {
      const ipRes  = await fetch('https://ipapi.co/json/');
      const ipData = await ipRes.json();
      city    = ipData.city         || '';
      country = ipData.country_name || '';
    } catch (_) {}

    const userKey = getUserKey();
    let session;

    // ── USDC ──────────────────────────────────
    if (selectedMethod === 'usdc') {
      const res = await fetch(CREATE_USDC_URL, {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({ amount, userKey, source: 'cpay-cash.app', city, country }),
      });
      
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to create USDC invoice');

      const solanaPayUrl = data.solanaPayUrl || data.recipientWallet;
      session = {
        amount:      Number(data.amount),
        invoiceId:   data.invoiceId,
        paymentType: 'usdc',
        payCode:     data.recipientWallet,
        qrText:      solanaPayUrl,
        cashAppUrl:  `https://cash.app/launch/solana/${encodeURIComponent(solanaPayUrl)}`,
        secondsLeft: USDC_SECONDS,
        expiresAt:   data.expiresAt || null,
      };
      
    // ── Lightning ─────────────────────────────
    } else if (selectedMethod === 'lightning') {
      const res = await fetch(BTCPAY_URL, {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({
          action:      'create_btc_invoice',
          amount,
          paymentType: 'lightning',
          userKey,
          source:      'cpay-cash.app',
          city,
          country,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to create Lightning invoice');

      let bolt11 = data.lightningCode || '';
      if (bolt11.toLowerCase().startsWith('lightning:')) bolt11 = bolt11.slice(10);

      session = {
        amount:      Number(data.amount),
        invoiceId:   data.invoiceId,
        paymentType: 'lightning',
        payCode:     bolt11,
        qrText:      bolt11,
        cashAppUrl:  `https://cash.app/launch/lightning/${bolt11}`,
        secondsLeft: BTC_SECONDS,
        expiresAt:   data.expiresAt || null,
      };

    // ── On-Chain BTC ──────────────────────────
    } else {
      const res = await fetch(BTCPAY_URL, {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        },
        body: JSON.stringify({
          action:      'create_btc_invoice',
          amount,
          paymentType: 'onchain',
          userKey,
          source:      'cpay-cash.app',
          city,
          country,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to create BTC invoice');

      const btcAddr    = data.btcAddress  || '';
      const btcAmount  = Number(data.btcAmount || 0);
      const cashAppUrl = `bitcoin:${btcAddr}?amount=${btcAmount}`;

      session = {
        amount:      Number(data.amount),
        invoiceId:   data.invoiceId,
        paymentType: 'onchain',
        payCode:     btcAddr,
        qrText:      cashAppUrl,
        cashAppUrl:  cashAppUrl,
        btcAmount:   btcAmount,
        secondsLeft: BTC_SECONDS,
        expiresAt:   data.expiresAt || null,
      };
    }

    // ── Save & Redirect ───────────────────────
    sessionStorage.setItem('invoiceSession', JSON.stringify(session));

    if (session.paymentType === 'usdc') {
      window.location.href = 'pay/invoice-usdc.html';
    } else {
      window.location.href = 'pay/invoice-btc.html';
    }

  } catch (e) {
    hideLoading();
    alert(`Error: ${e.message}`);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  sessionStorage.removeItem('invoiceSession');
  updateDisplay();
});
</script>
</body>
</html>
