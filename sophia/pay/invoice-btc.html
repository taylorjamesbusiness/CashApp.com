<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scan Bitcoin QR – Cash App</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300D632'/><text x='50' y='72' font-size='65' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>$</text></svg>" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
/* ====== RESET & BASE ====== */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  font-family: 'DM Sans', sans-serif;
  background: #000; /* Pure Black for Camera UI */
  color: #fff;
  overflow: hidden;
}

body {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}

/* ====== SCANNER UI (STEP 2) ====== */
#step2 {
  width: 100%; max-width: 430px; height: 100%; 
  display: flex; flex-direction: column;
  padding: 24px 20px; position: relative;
}

/* Top Nav (X and Flashlight) */
.s2-topbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 30px; margin-top: 10px;
}
.icon-btn {
  width: 44px; height: 44px;
  background: rgba(255, 255, 255, 0.1);
  border: none; border-radius: 50%;
  color: #fff; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.2s;
}
.icon-btn:active { background: rgba(255, 255, 255, 0.2); }

/* Title */
.scanner-title {
  font-size: 26px; font-weight: 700; line-height: 1.15;
  margin-bottom: 40px; letter-spacing: -0.5px;
}

/* QR Code Section */
.qr-container {
  display: flex; flex-direction: column; align-items: center; flex: 1;
}
.qr-link { text-decoration: none; display: block; }
.qr-outer-frame {
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  border-radius: 36px; padding: 18px;
  position: relative; display: inline-block;
  transition: transform 0.2s;
}
.qr-outer-frame:active { transform: scale(0.98); }
#qrcode {
  background: #fff; padding: 12px; border-radius: 20px;
}
#qrcode img { border-radius: 8px; }

/* Center B Logo */
.qr-logo {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: #fff; padding: 4px; border-radius: 10px;
}
.qr-logo-inner {
  background: #000; color: #fff;
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 22px; border-radius: 8px;
  font-family: Arial, sans-serif;
}

/* Subtitle */
.scanner-tip {
  color: rgba(255, 255, 255, 0.7); font-size: 13px; font-weight: 500;
  margin-top: 24px; text-align: center;
}

/* Bottom Action Button */
.action-footer {
  padding-bottom: 20px; width: 100%; display: flex; justify-content: center;
}
.pill-btn {
  background: #fff; color: #000; border: none; border-radius: 999px;
  padding: 18px 32px; font-size: 16px; font-weight: 700;
  width: 100%; max-width: 340px; cursor: pointer;
  transition: transform 0.1s, opacity 0.2s; font-family: 'DM Sans', sans-serif;
}
.pill-btn:active { transform: scale(0.96); opacity: 0.9; }

/* ====== SUCCESS UI (STEP 3) ====== */
#step3 {
  display: none; width: 100%; max-width: 430px; height: 100%;
  flex-direction: column; align-items: center; justify-content: center;
  padding: 24px 20px; text-align: center;
}
.success-icon {
  width: 80px; height: 80px; background: #00C851; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px; animation: pop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
}
@keyframes pop {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}
.success-title { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 6px; }
.success-sub { color: rgba(255, 255, 255, 0.5); font-size: 14px; margin-bottom: 8px; }
.success-amount { font-size: 44px; font-weight: 800; color: #00C851; margin-bottom: 40px; }
</style>
</head>
<body>

<div id="step2">
  
  <div class="s2-topbar">
    <button class="icon-btn" onclick="goBack()">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
    <button class="icon-btn">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
        <path d="M7 2h10v4l-3 4v10a2 2 0 0 1-4 0V10L7 6V2zm2 2v1.17L11.4 8v10h1.2V8L15 5.17V4H9z"/>
      </svg>
    </button>
  </div>

  <div class="scanner-title">Scan a Bitcoin or<br>Lightning QR code</div>

  <div class="qr-container">
    <a id="qrLink" href="#" target="_blank" class="qr-link">
      <div class="qr-outer-frame">
        <div id="qrcode"></div>
        <div class="qr-logo">
          <div class="qr-logo-inner">₿</div>
        </div>
      </div>
    </a>
    <div class="scanner-tip">Position the QR Code in view to activate</div>
  </div>

  <div class="action-footer">
    <button id="actionBtn" class="pill-btn" onclick="handleAction()">Copy address</button>
  </div>
  
</div>

<div id="step3">
  <div class="success-icon">
    <svg width="44" height="44" fill="none" stroke="#000" stroke-width="3" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
    </svg>
  </div>
  <div class="success-title">Payment Received!</div>
  <div class="success-sub">Thank you for your payment</div>
  <div class="success-amount" id="successAmount">$0.00</div>
  <button class="pill-btn" onclick="clearSession()">Done</button>
</div>

<script>
// --- Supabase Settings ---
const SUPABASE_URL = 'https://dirokbqnuosazuwhbdhs.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpcm9rYnFudW9zYXp1d2hiZGhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MDAwOTksImV4cCI6MjA5ODk3NjA5OX0.UTHzC66WjL37dNgc-VWNswH-nCvAvgvEDpz8KYsQp-A';

let timerInterval, pollInterval;
let currentPayCode = '';
let hasCopiedBtn = false;
let autoResetTimer;

function showStep(n) {
  document.getElementById('step2').style.display = n === 2 ? 'flex' : 'none';
  document.getElementById('step3').style.display = n === 3 ? 'flex' : 'none';
}

window.addEventListener('DOMContentLoaded', () => {
  const saved = sessionStorage.getItem('invoiceSession');
  if (!saved) {
    window.location.href = '../index.html';
    return;
  }
  try {
    const sessionData = JSON.parse(saved);
    // Ensure we get the correct code depending on the format returned
    currentPayCode = sessionData.payCode || sessionData.bolt11 || sessionData.qrText;
    
    showStep(2);
    renderInvoice(sessionData);
  } catch(e) {
    sessionStorage.removeItem('invoiceSession');
    window.location.href = '../index.html';
  }
});

function renderInvoice(data) {
  const { amount, cashAppUrl, invoiceId, secondsLeft } = data;
  
  // Create QR Code (Large and clear to match Image)
  document.getElementById('qrcode').innerHTML = '';
  new QRCode(document.getElementById('qrcode'), {
    text: cashAppUrl || currentPayCode,
    width: 240, 
    height: 240,
    colorDark: '#000000', 
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  // Link QR code to CashApp Launch
  document.getElementById('qrLink').href = cashAppUrl || '#';
  
  startTimer(secondsLeft || 3600, invoiceId);
  startPolling(invoiceId, amount);
}

// --- Action Button Logic ---
function handleAction() {
  const btn = document.getElementById('actionBtn');
  
  if (!hasCopiedBtn) {
    // Step 1: Copy Address
    if(!currentPayCode) return;
    navigator.clipboard.writeText(currentPayCode);
    
    // Change Button State
    btn.textContent = 'Open Cash App';
    hasCopiedBtn = true;

    // Safety fallback: Auto-reset button after 10 seconds just in case
    clearTimeout(autoResetTimer);
    autoResetTimer = setTimeout(() => {
      resetActionBtn();
    }, 10000);

  } else {
    // Step 2: Open Cash App Link
    const cashAppUrl = document.getElementById('qrLink').href;
    if (cashAppUrl && cashAppUrl !== '#') {
      window.location.href = cashAppUrl;
    }
  }
}

// Function to reset the button back to "Copy address"
function resetActionBtn() {
  if (hasCopiedBtn) {
    document.getElementById('actionBtn').textContent = 'Copy address';
    hasCopiedBtn = false;
  }
}

// Event Listener: When user comes back to the browser from Cash App
window.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    resetActionBtn();
  }
});


// --- Hidden Timer Logic (Kicks user back to index if time expires) ---
function startTimer(sec, invoiceId) {
  clearInterval(timerInterval);
  let t = sec;
  timerInterval = setInterval(() => {
    if (t <= 0) {
      clearInterval(timerInterval);
      clearInterval(pollInterval);
      sessionStorage.removeItem('invoiceSession');
      window.location.href = '../index.html'; // Go back when expired
      return;
    }
    const saved = sessionStorage.getItem('invoiceSession');
    if (saved) {
      const obj = JSON.parse(saved);
      obj.secondsLeft = t;
      sessionStorage.setItem('invoiceSession', JSON.stringify(obj));
    }
    t--;
  }, 1000);
}

// --- Payment Confirmation Polling Logic ---
function startPolling(invoiceId, amount) {
  clearInterval(pollInterval);
  // Pings server every 5 seconds to check if payment is Settled/Processing
  pollInterval = setInterval(async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/btcpay-webhook`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
        body: JSON.stringify({ checkStatus: true, invoiceId })
      });
      const data = await res.json();
      
      // If server returns Success, show the Success Screen (Step 3)
      if (data?.status === 'settled' || data?.status === 'Processing') {
        clearInterval(pollInterval);
        clearInterval(timerInterval);
        sessionStorage.removeItem('invoiceSession');
        showStep(3); // Hide scanner, show Green tick screen
        document.getElementById('successAmount').textContent = '$' + parseFloat(amount).toFixed(2);
      }
    } catch(e) {
      console.error('Polling error', e);
    }
  }, 5000);
}

function goBack() {
  clearInterval(timerInterval);
  clearInterval(pollInterval);
  sessionStorage.removeItem('invoiceSession');
  window.location.href = '../index.html';
}

function clearSession() {
  sessionStorage.removeItem('invoiceSession');
  window.location.href = '../index.html';
}
</script>
</body>
</html>
