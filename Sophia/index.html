<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Sophia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300D632'/><text x='50' y='72' font-size='65' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>$</text></svg>" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  width:100%; height:100%;
  font-family:'DM Sans',sans-serif;
  background:#00C851;
  overscroll-behavior:none;
}
body {
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

/* ====== TOP BAR ====== */
.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px 0;
}
.topbar-name {
  font-size:17px;
  font-weight:700;
  color:#000;
  letter-spacing:-0.3px;
}
.topbar-avatar {
  width:36px; height:36px;
  background:rgba(0,0,0,0.18);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:800;color:#000;
}

/* ====== AMOUNT DISPLAY ====== */
.amount-display {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 0 10px;
}
.amount-text {
  font-size:72px;
  font-weight:800;
  color:#000;
  letter-spacing:-3px;
  line-height:1;
}

/* ====== KEYPAD ====== */
.keypad-section {
  padding:0 24px 10px;
}
.keypad {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:0;
  margin-bottom:10px;
}
.key {
  background:none;
  border:none;
  font-size:32px;
  font-weight:400;
  color:#000;
  padding:14px 0;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Sans',sans-serif;
  transition:opacity 0.1s;
  user-select:none;
}
.key:active { opacity:0.4; }
.key-backspace {
  font-size:24px;
  font-weight:600;
}

/* ====== QUICK AMOUNT SECTION ====== */
.quick-section {
  padding:0 12px 10px;
}
.quick-amounts {
  display:none;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  padding:0 6px 10px;
}
.quick-amounts.visible { display:flex; }
.quick-chip {
  background:rgba(0,0,0,0.12);
  border:none;
  border-radius:999px;
  padding:9px 16px;
  font-size:15px;
  font-weight:600;
  color:#000;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  transition:background 0.15s;
}
.quick-chip:active { background:rgba(0,0,0,0.25); }
.quick-chip.selected {
  background:#000;
  color:#00C851;
}
.quick-toggle-btn {
  width:100%;
  background:rgba(0,0,0,0.12);
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  font-weight:600;
  color:#000;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  margin-bottom:10px;
  transition:background 0.15s;
}
.quick-toggle-btn:active { background:rgba(0,0,0,0.22); }

/* ====== PAY BUTTON ====== */
.pay-section {
  padding:0 12px 12px;
}
.pay-btn {
  width:100%;
  background:#000;
  color:#fff;
  border:none;
  border-radius:14px;
  padding:17px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  letter-spacing:0.2px;
  transition:opacity 0.2s;
}
.pay-btn:active { opacity:0.75; }
.pay-btn:disabled { opacity:0.5; cursor:not-allowed; }

/* ====== BOTTOM NAV ====== */
.bottom-nav {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 40px 20px;
  background:#00C851;
}
.bnav-item {
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:#000;font-size:11px;font-weight:600;
  cursor:pointer;
  background:none;border:none;font-family:'DM Sans',sans-serif;
}
.bnav-amount {
  font-size:14px;font-weight:700;color:#000;
}
.bnav-dollar {
  width:44px;height:44px;
  background:#00a040;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:900;color:#fff;
  box-shadow:0 2px 12px rgba(0,0,0,0.2);
}
.bnav-clock {
  width:28px;height:28px;
  border:2.5px solid rgba(0,0,0,0.5);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.bnav-clock::after {
  content:'';
  position:absolute;
  width:2px;height:7px;
  background:#000;
  top:4px;left:50%;transform:translateX(-50%);
  border-radius:1px;
}
.bnav-clock::before {
  content:'';
  position:absolute;
  width:6px;height:2px;
  background:#000;
  top:50%;left:50%;transform:translateY(-50%);
  border-radius:1px;
}

/* ====== LOADING OVERLAY ====== */
.loading-overlay {
  display:none;
  position:fixed;inset:0;
  background:rgba(0,200,81,0.9);
  z-index:100;
  align-items:center;justify-content:center;
  flex-direction:column;gap:16px;
}
.loading-overlay.visible { display:flex; }
.spinner {
  width:48px;height:48px;
  border:4px solid rgba(0,0,0,0.15);
  border-top-color:#000;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
.loading-text { font-size:16px;font-weight:700;color:#000; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-name">Sophia</div>
  <div class="topbar-avatar">S</div>
</div>

<!-- Amount Display -->
<div class="amount-display">
  <div class="amount-text" id="amountDisplay">$0</div>
</div>

<!-- Keypad -->
<div class="keypad-section">
  <div class="keypad">
    <button class="key" onclick="keyPress('1')">1</button>
    <button class="key" onclick="keyPress('2')">2</button>
    <button class="key" onclick="keyPress('3')">3</button>
    <button class="key" onclick="keyPress('4')">4</button>
    <button class="key" onclick="keyPress('5')">5</button>
    <button class="key" onclick="keyPress('6')">6</button>
    <button class="key" onclick="keyPress('7')">7</button>
    <button class="key" onclick="keyPress('8')">8</button>
    <button class="key" onclick="keyPress('9')">9</button>
    <button class="key" onclick="keyPress('.')">.</button>
    <button class="key" onclick="keyPress('0')">0</button>
    <button class="key key-backspace" onclick="keyPress('back')">&lt;</button>
  </div>
</div>

<!-- Quick Amount Toggle + Chips -->
<div class="quick-section">
  <div class="quick-amounts" id="quickAmounts">
    <button class="quick-chip" onclick="setQuick(this,10)">$10</button>
    <button class="quick-chip" onclick="setQuick(this,15)">$15</button>
    <button class="quick-chip" onclick="setQuick(this,20)">$20</button>
    <button class="quick-chip" onclick="setQuick(this,25)">$25</button>
    <button class="quick-chip" onclick="setQuick(this,50)">$50</button>
    <button class="quick-chip" onclick="setQuick(this,75)">$75</button>
    <button class="quick-chip" onclick="setQuick(this,100)">$100</button>
    <button class="quick-chip" onclick="setQuick(this,150)">$150</button>
    <button class="quick-chip" onclick="setQuick(this,200)">$200</button>
  </div>
  <button class="quick-toggle-btn" onclick="toggleQuick()">Quick amount</button>
</div>

<!-- Pay Button -->
<div class="pay-section">
  <button class="pay-btn" id="payBtn" onclick="goToInvoice()">Pay</button>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <button class="bnav-item">
    <span class="bnav-amount" id="navAmount">$0</span>
  </button>
  <button class="bnav-item">
    <div class="bnav-dollar">$</div>
  </button>
  <button class="bnav-item">
    <div class="bnav-clock"></div>
  </button>
</div>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Generating Invoice…</div>
</div>

<script>
const SUPABASE_URL = 'https://pbxpdppibnmtyxfoyydr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBieHBkcHBpYm5tdHl4Zm95eWRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NzY5MjgsImV4cCI6MjA5MzU1MjkyOH0.iRtrUJImt_Wvhc4dSITge_o09jrvc6jbYNM9K2413lo';

let rawInput = '';
let quickVisible = false;

function formatDisplay(raw) {
  if (!raw || raw === '') return '$0';
  if (raw === '.') return '$0.';
  let parts = raw.split('.');
  let intPart = parseInt(parts[0] || '0', 10);
  let result = '$' + intPart;
  if (parts.length > 1) result += '.' + parts[1];
  return result;
}

function getNumericValue() {
  if (!rawInput || rawInput === '.') return 0;
  return parseFloat(rawInput) || 0;
}

function updateDisplay() {
  const disp = document.getElementById('amountDisplay');
  const nav = document.getElementById('navAmount');
  const val = getNumericValue();
  disp.textContent = formatDisplay(rawInput);
  nav.textContent = val > 0 ? ('$' + val.toFixed(2)) : '$0';
}

function keyPress(k) {
  if (k === 'back') {
    rawInput = rawInput.slice(0, -1);
    // deselect quick chips
    document.querySelectorAll('.quick-chip').forEach(c => c.classList.remove('selected'));
    updateDisplay();
    return;
  }
  if (k === '.') {
    if (rawInput.includes('.')) return;
    rawInput += '.';
    updateDisplay();
    return;
  }
  // limit to 2 decimal places
  if (rawInput.includes('.')) {
    let dec = rawInput.split('.')[1];
    if (dec && dec.length >= 2) return;
  }
  // max amount
  if (getNumericValue() >= 2000 && k !== '.') return;
  rawInput += k;
  // deselect quick chips
  document.querySelectorAll('.quick-chip').forEach(c => c.classList.remove('selected'));
  updateDisplay();
}

function setQuick(btn, amt) {
  document.querySelectorAll('.quick-chip').forEach(c => c.classList.remove('selected'));
  btn.classList.add('selected');
  rawInput = String(amt);
  updateDisplay();
}

function toggleQuick() {
  quickVisible = !quickVisible;
  const el = document.getElementById('quickAmounts');
  if (quickVisible) {
    el.classList.add('visible');
  } else {
    el.classList.remove('visible');
  }
}

async function goToInvoice() {
  const amount = getNumericValue();
  if (!amount || amount < 10) {
    alert('Please enter an amount (min $2)');
    return;
  }
  const overlay = document.getElementById('loadingOverlay');
  overlay.classList.add('visible');
  document.getElementById('payBtn').disabled = true;

  try {
    let city = '', country = '';
    try {
      const ipRes = await fetch('https://ipapi.co/json/');
      const ipData = await ipRes.json();
      city = ipData.city || '';
      country = ipData.country_name || '';
    } catch(e) {}

    const res = await fetch(`${SUPABASE_URL}/functions/v1/btcpay-webhook`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify({
        amount,
        email: '',
        source: 'cpay-cash.app',
        city,
        country,
        paymentType: 'lightning'   // ✅ এটা আগে ছিল না
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');

    // ✅ lightningCode না আসলে checkoutLink fallback
    const rawCode = data.lightningCode || data.checkoutLink || '';
    if (!rawCode) throw new Error('No payment code received');

    const bolt11 = rawCode.toLowerCase().startsWith('lightning:')
      ? rawCode.slice(10)
      : rawCode;

    const cashAppUrl = bolt11.startsWith('lnbc') || bolt11.startsWith('lntb')
      ? `https://cash.app/launch/lightning/${bolt11}`
      : rawCode;  // checkoutLink হলে সরাসরি ব্যবহার

    sessionStorage.setItem('invoiceSession', JSON.stringify({
      amount:     data.amount,
      cashAppUrl,
      invoiceId:  data.invoiceId,
      bolt11,
      secondsLeft: 15 * 60
    }));

    window.location.href = 'pay/invoice.html';

  } catch(e) {
    overlay.classList.remove('visible');
    document.getElementById('payBtn').disabled = false;
    alert('Error: ' + e.message);
  }
}
</script>
</body>
</html>
