<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#000;
  color:#fff;
}

.container {
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card {
  background:#111;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

input {
  width:100%;
  padding:10px;
  margin-bottom:10px;
}

button {
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="container">
  <div class="card">
    <h2>Admin Login</h2>

    <input id="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="container" style="display:none;">

  <div class="card">
    <h3>Balance</h3>
    <div id="balance">$0</div>
  </div>

  <div class="card">
    <h3>Payments</h3>
    <div id="payments"></div>
  </div>

  <div class="card">
    <h3>Withdrawals</h3>
    <div id="withdraws"></div>
  </div>

  <button onclick="logout()">Logout</button>

</div>

<script>

// ✅ ONLY ONE SUPABASE INSTANCE
const SUPABASE_URL = "https://qhyimqvuzzanekcqaemg.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

// ✅ LOGIN FUNCTION
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('pass').value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  console.log(data, error);

  if (error) {
    alert(error.message);
    return;
  }

  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  loadData();
}

// ✅ LOAD DATA
async function loadData() {

  // balance
  const { data: payments } = await supabase
    .from('payments')
    .select('amount')
    .eq('approval_status','approved');

  let total = 0;
  payments?.forEach(p => total += Number(p.amount));

  document.getElementById('balance').innerText = "$" + total.toFixed(2);

  // payments list
  const pDiv = document.getElementById('payments');
  pDiv.innerHTML = '';

  payments?.forEach(p => {
    pDiv.innerHTML += `<div>$${p.amount}</div>`;
  });

  // withdrawals
  const { data: wd } = await supabase
    .from('withdrawals')
    .select('*')
    .order('created_at',{ascending:false});

  const wDiv = document.getElementById('withdraws');
  wDiv.innerHTML = '';

  wd?.forEach(w => {
    wDiv.innerHTML += `
      <div class="card">
        $${w.amount}
      </div>
    `;
  });
}

// ✅ LOGOUT
async function logout() {
  await supabase.auth.signOut();
  location.reload();
}

</script>

</body>
</html>
