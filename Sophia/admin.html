<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;font-family:sans-serif;background:#000;color:#fff;}
.container{max-width:1100px;margin:auto;padding:20px;}
.card{background:#111;padding:15px;border-radius:10px;margin-bottom:15px;}
input{width:100%;padding:10px;margin-bottom:10px;}
button{padding:10px;border:none;border-radius:6px;cursor:pointer;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="container">
  <div class="card">
    <h2>Login</h2>
    <input id="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="container" style="display:none;">
  <div class="card">
    <h3>Global Balance</h3>
    <div id="balance">$0</div>
  </div>

  <div class="card">
    <h3>Brands</h3>
    <div id="brands"></div>
  </div>

  <div class="card">
    <h3>Withdrawals</h3>
    <div id="withdraws"></div>
  </div>

  <button onclick="logout()">Logout</button>
</div>

<script>

// ✅ ONLY ONE SUPABASE INSTANCE
const SUPABASE_URL = "https://qhyimqvuzzanekcqaemg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoeWltcXZ1enphbmVrY3FhZW1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyODQ0NTgsImV4cCI6MjA5Nzg2MDQ1OH0.9_N1k4KhmK0Q9biy1SBOo6bvHsZEbTsyaPLz1t1k-R0";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

// ✅ LOGIN
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('pass').value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  console.log(data, error);

  if (error) {
    alert(error.message);
    return;
  }

  // ✅ DIRECT UI SWITCH (NO SESSION BUG)
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  loadData();
}

// ✅ LOAD DATA
async function loadData() {

  // balance
  const { data: payments } = await supabase
    .from('payments')
    .select('amount')
    .eq('approval_status','approved');

  let total = 0;
  payments?.forEach(p => total += Number(p.amount));

  document.getElementById('balance').innerText = "$" + total.toFixed(2);

  // brands
  const { data: brands } = await supabase.from('brands').select('*');

  const bDiv = document.getElementById('brands');
  bDiv.innerHTML = '';

  for (const b of brands || []) {
    const { data: bal } = await supabase.rpc('approved_balance', {
      p_brand: b.id
    });

    bDiv.innerHTML += `
      <div class="card">
        ${b.display_name} → $${(bal || 0).toFixed(2)}
      </div>
    `;
  }

  // withdrawals
  const { data: wd } = await supabase
    .from('withdrawals')
    .select('*')
    .order('created_at',{ascending:false});

  const wDiv = document.getElementById('withdraws');
  wDiv.innerHTML = '';

  wd?.forEach(w => {
    wDiv.innerHTML += `
      <div class="card">
        $${w.amount} - ${w.note || ''}
        <br>
        <button onclick="done('${w.id}')">Done</button>
        <button onclick="del('${w.id}')">Delete</button>
      </div>
    `;
  });
}

// ✅ ACTIONS
async function done(id){
  await supabase.from('withdrawals')
    .update({status:'completed'})
    .eq('id', id);
  loadData();
}

async function del(id){
  await supabase.from('withdrawals')
    .delete()
    .eq('id', id);
  loadData();
}

// ✅ LOGOUT
async function logout(){
  await supabase.auth.signOut();
  location.reload();
}

</script>

</body>
</html>
