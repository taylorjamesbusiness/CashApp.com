<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pay with PayPal · Pay Valentina</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 100px 0;
    }

    .topbar {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
    }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      background: #1a1a1a; border: 1px solid #2a2a2a;
      color: #aaa; font-size: 13px; padding: 7px 14px;
      border-radius: 20px; cursor: pointer; text-decoration: none;
    }
    .back-btn:hover { background: #222; }
    .back-btn span { font-size: 15px; }

    .brand-logo {
      display: flex; align-items: center; gap: 8px;
    }
    .brand-logo svg { height: 22px; }

    .how-btn {
      display: flex; align-items: center; gap: 5px;
      background: #1a2a3a; border: 1px solid #1e4060;
      color: #4aa6e8; font-size: 13px; padding: 7px 14px;
      border-radius: 20px; cursor: pointer; text-decoration: none;
    }
    .how-btn:hover { background: #1e3450; }
    .how-btn span { font-size: 14px; }

    .card {
      width: 100%; max-width: 480px;
      padding: 0 16px;
    }

    .amount-section {
      text-align: center;
      padding: 24px 0 20px;
    }
    .amount-label {
      font-size: 11px; color: #555;
      text-transform: uppercase; letter-spacing: 1.2px;
      margin-bottom: 8px;
    }
    .amount-value {
      font-size: 48px; font-weight: 800; color: #fff;
      letter-spacing: -1px;
    }
    .amount-sub {
      font-size: 13px; color: #555; margin-top: 6px;
    }

    .qr-container {
      display: flex; justify-content: center;
      margin-bottom: 28px;
    }
    .qr-wrapper {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      position: relative;
      display: inline-flex;
    }
    .qr-wrapper canvas { display: block; border-radius: 6px; }
    .qr-logo {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 38px; height: 38px;
      background: #fff;
      border-radius: 50%;
      display: flex; align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 3px #fff;
    }
    .qr-logo svg { width: 26px; height: 26px; }

    .timer-section {
      text-align: center;
      margin-bottom: 24px;
    }
    .timer-label {
      font-size: 11px; color: #555;
      text-transform: uppercase; letter-spacing: 1.2px;
      margin-bottom: 8px;
    }
    .timer-value {
      font-size: 40px; font-weight: 700;
      color: #fff; letter-spacing: 4px;
    }
    .timer-value.urgent { color: #ef4444; }

    .info-rows {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid #1a1a1a;
    }
    .info-row:last-child { border-bottom: none; }
    .info-key {
      font-size: 12px; color: #555;
      text-transform: capitalize;
    }
    .info-val {
      font-size: 13px; color: #aaa;
      font-family: monospace;
      text-align: right;
    }
    .network-pills {
      display: flex; align-items: center; gap: 6px;
    }
    .pill {
      font-size: 12px; color: #aaa;
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 20px; padding: 3px 10px;
    }
    .status-badge {
      font-size: 11px; font-weight: 600;
      padding: 4px 12px; border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .badge-pending { background: #1a1600; color: #f59e0b; }
    .badge-settled { background: #0d1f13; color: #00c97a; }
    .badge-expired { background: #1a0d0d; color: #ef4444; }

    .address-section {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .address-section-label {
      font-size: 11px; color: #555;
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .address-text {
      font-size: 12px; color: #888;
      font-family: monospace;
      word-break: break-all;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .copy-btn {
      width: 100%;
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #fff;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .copy-btn:hover { background: #222; }
    .copy-btn.copied {
      background: #0d1f13; border-color: #1a4a35;
      color: #00c97a;
    }

    .cta-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 12px 16px 24px;
      background: linear-gradient(to top, #0a0a0a 70%, transparent);
      display: flex; justify-content: center;
    }
    .cta-btn {
      width: 100%; max-width: 480px;
      display: flex; align-items: center; justify-content: space-between;
      background: #111; border: 1px solid #1e1e1e;
      border-radius: 14px; padding: 14px 18px;
      cursor: pointer; text-decoration: none; color: #fff;
      transition: background 0.15s;
    }
    .cta-btn:hover { background: #161616; }
    .cta-btn.disabled {
      pointer-events: none; opacity: 0.5;
    }
    .cta-left {
      display: flex; align-items: center; gap: 12px;
    }
    .cta-icon {
      width: 40px; height: 40px;
      background: #003087;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .cta-icon svg { width: 22px; height: 22px; }
    .cta-text-top {
      font-size: 15px; font-weight: 600; color: #fff;
    }
    .cta-text-bottom {
      font-size: 12px; color: #555; margin-top: 2px;
    }
    .cta-arrow {
      font-size: 20px; color: #444;
    }

    .full-msg {
      text-align: center;
      padding: 20px 16px;
    }
    .full-msg a {
      color: #4aa6e8; font-size: 13px;
      text-decoration: none; display: block; margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="./index.html">
    <span>‹</span> Back
  </a>

  <div class="brand-logo">
    <!-- PayPal wordmark SVG -->
    <svg viewBox="0 0 101 32" xmlns="http://www.w3.org/2000/svg" height="22">
      <path d="M12.237 2.8H5.877C5.43 2.8 5.047 3.12 4.98 3.563L2.334 20.116a.596.596 0 0 0 .588.684h3.012c.448 0 .83-.32.897-.763l.657-4.158c.066-.443.45-.763.896-.763h2.082c4.335 0 6.836-2.097 7.49-6.253.295-1.816.012-3.245-.84-4.244-.938-1.098-2.6-1.619-4.879-1.619zm.759 6.158c-.36 2.355-2.163 2.355-3.907 2.355h-.992l.696-4.405a.536.536 0 0 1 .53-.452h.455c1.188 0 2.31 0 2.889.677.347.405.453.998.329 1.825z" fill="#253B80"/>
      <path d="M35.395 8.882h-3.022c-.247 0-.463.17-.53.452l-.136.869-.217-.314c-.67-.971-2.163-1.296-3.654-1.296-3.418 0-6.337 2.59-6.904 6.22-.295 1.812.124 3.543 1.147 4.751.939 1.108 2.28 1.57 3.877 1.57 2.754 0 4.282-1.77 4.282-1.77l-.138.862a.596.596 0 0 0 .587.684h2.722c.447 0 .83-.32.896-.763l1.634-10.34a.596.596 0 0 0-.544-.725zm-4.212 6.017c-.3 1.769-1.708 2.956-3.497 2.956-.9 0-1.62-.29-2.083-.838-.46-.545-.633-1.32-.488-2.183.28-1.753 1.713-2.98 3.476-2.98.882 0 1.598.292 2.068.845.472.557.659 1.337.524 2.2z" fill="#253B80"/>
      <path d="M55.496 8.882h-3.036a.898.898 0 0 0-.742.394l-4.286 6.312-1.817-6.066a.899.899 0 0 0-.862-.64h-2.98a.538.538 0 0 0-.51.714l3.422 10.05-3.217 4.541a.538.538 0 0 0 .44.847h3.033c.293 0 .566-.147.733-.39l10.326-14.91a.538.538 0 0 0-.504-.852z" fill="#253B80"/>
      <path d="M67.457 2.8h-6.36c-.446 0-.83.32-.896.763L57.555 20.116a.596.596 0 0 0 .588.684h3.23c.312 0 .577-.226.626-.535l.68-4.386c.065-.443.449-.763.896-.763h2.08c4.336 0 6.836-2.097 7.49-6.253.296-1.816.013-3.245-.839-4.244-.937-1.098-2.598-1.619-4.849-1.819zm.758 6.158c-.36 2.355-2.162 2.355-3.906 2.355h-.992l.697-4.405a.536.536 0 0 1 .529-.452h.455c1.188 0 2.31 0 2.888.677.348.405.453.998.329 1.825z" fill="#179BD7"/>
      <path d="M90.614 8.882h-3.02c-.247 0-.463.17-.53.452l-.136.869-.217-.314c-.671-.971-2.163-1.296-3.655-1.296-3.417 0-6.337 2.59-6.903 6.22-.295 1.812.124 3.543 1.147 4.751.94 1.108 2.28 1.57 3.877 1.57 2.754 0 4.282-1.77 4.282-1.77l-.138.862a.596.596 0 0 0 .587.684h2.722c.448 0 .83-.32.897-.763l1.633-10.34a.595.595 0 0 0-.546-.725zm-4.21 6.017c-.3 1.769-1.71 2.956-3.498 2.956-.899 0-1.62-.29-2.082-.838-.46-.545-.634-1.32-.488-2.183.28-1.753 1.713-2.98 3.476-2.98.882 0 1.597.292 2.067.845.473.557.66 1.337.525 2.2z" fill="#179BD7"/>
      <path d="M98.178 3.17l-2.673 17.01a.596.596 0 0 0 .588.684h2.603c.447 0 .83-.32.896-.763L102.24 3.549a.596.596 0 0 0-.587-.684h-2.914a.598.598 0 0 0-.561.305z" fill="#179BD7"/>
    </svg>
  </div>

  <a class="how-btn" href="#" onclick="return false;">
    <span>?</span> How to pay
  </a>
</div>

<div class="card">

  <div class="amount-section">
    <div class="amount-label">Amount Due</div>
    <div class="amount-value" id="display-amount">$--</div>
    <div class="amount-sub">Send PYUSD on Solana to the address below</div>
  </div>

  <div class="qr-container">
    <div class="qr-wrapper">
      <canvas id="qr-canvas"></canvas>
      <div class="qr-logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M7.5 21L9.75 7.5H14.25C16.5 7.5 18 8.7 17.625 11.25C17.25 13.5 15.375 15 12.75 15H10.5L9.75 21H7.5Z" fill="#003087"/>
          <path d="M10.875 13.5L11.625 9H14.25C15.75 9 16.5 9.75 16.125 11.25C15.75 12.75 14.625 13.5 12.75 13.5H10.875Z" fill="#179BD7"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="timer-section">
    <div class="timer-label">Time Remaining</div>
    <div class="timer-value" id="countdown">-- : --</div>
  </div>

  <div class="info-rows">
    <div class="info-row">
      <span class="info-key">Reference</span>
      <span class="info-val" id="display-invoice-id">--</span>
    </div>
    <div class="info-row">
      <span class="info-key">Network</span>
      <div class="network-pills">
        <span class="pill">Solana</span>
        <span class="pill">PYUSD</span>
      </div>
    </div>
    <div class="info-row">
      <span class="info-key">Status</span>
      <span class="status-badge badge-pending" id="status-badge">AWAITING PAYMENT</span>
    </div>
  </div>

  <div class="address-section">
    <div class="address-section-label">PYUSD Wallet Address (Solana)</div>
    <div class="address-text" id="display-address">Loading...</div>
    <button class="copy-btn" id="copy-btn" onclick="copyAddress()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      Copy address
    </button>
  </div>

  <div class="full-msg" id="tx-msg" style="display:none;"></div>
</div>

<div class="cta-bar">
  <a class="cta-btn" id="open-paypal-btn"
     href="https://www.paypal.com/crypto" target="_blank" rel="noopener noreferrer">
    <div class="cta-left">
      <div class="cta-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="white">
          <path d="M7.5 21L9.75 7.5H14.25C16.5 7.5 18 8.7 17.625 11.25C17.25 13.5 15.375 15 12.75 15H10.5L9.75 21H7.5Z"/>
        </svg>
      </div>
      <div>
        <div class="cta-text-top">Open PayPal → Send PYUSD</div>
        <div class="cta-text-bottom" id="cta-sub">Finances → Crypto → PayPal USD</div>
      </div>
    </div>
    <div class="cta-arrow">›</div>
  </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
const SUPABASE_URL  = "https://qhyimqvuzzanekcqaemg.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoeWltcXZ1enphbmVrY3FhZW1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyODQ0NTgsImV4cCI6MjA5Nzg2MDQ1OH0.9_N1k4KhmK0Q9biy1SBOo6bvHsZEbTsyaPLz1t1k-R0";

const PAGE_CONFIG = {
  payMethod: "paypal",
  explorerBaseUrl: "https://solscan.io/tx/"
};

const params    = new URLSearchParams(window.location.search);
const invoiceId = params.get("invoice_id");

let expiresAt = null;
let pollInterval = null;
let countdownInterval = null;

async function loadInvoice() {
  if (!invoiceId) { showError("No invoice ID."); return; }

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/invoices?id=eq.${invoiceId}&select=*`,
      { headers: { "apikey": SUPABASE_ANON, "Authorization": `Bearer ${SUPABASE_ANON}` } }
    );
    const data = await res.json();
    const inv = data[0];
    if (!inv) { showError("Invoice not found."); return; }

    if (inv.pay_method !== PAGE_CONFIG.payMethod) {
      showError("This invoice is not for PayPal."); return;
    }

    const amount = parseFloat(inv.amount_usd);
    document.getElementById("display-amount").textContent    = `$${amount.toFixed(2)}`;
    document.getElementById("display-invoice-id").textContent = `INV-APL9-${inv.id.substring(0,8).toUpperCase()}`;
    document.getElementById("display-address").textContent   = inv.external_address;

    document.getElementById("open-paypal-btn").href =
      `https://www.paypal.com/crypto/send?address=${encodeURIComponent(inv.external_address)}`;

    QRCode.toCanvas(document.getElementById("qr-canvas"), inv.external_address, {
      width: 200, margin: 1,
      color: { dark: "#000000", light: "#ffffff" }
    });

    if (inv.status === "settled") { showSettled(inv.paid_tx_signature); return; }
    if (inv.status === "expired") { showExpired(); return; }

    expiresAt = inv.expires_at ? new Date(inv.expires_at) : null;
    startCountdown();
    startPolling();

  } catch (e) {
    showError("Error loading invoice.");
  }
}

function startCountdown() {
  if (!expiresAt) return;
  countdownInterval = setInterval(() => {
    const diff = expiresAt - Date.now();
    const el = document.getElementById("countdown");
    if (diff <= 0) {
      clearInterval(countdownInterval);
      el.textContent = "00 : 00";
      el.classList.add("urgent");
      showExpired(); return;
    }
    const m = Math.floor(diff / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    el.textContent = `${String(m).padStart(2,"0")} : ${String(s).padStart(2,"0")}`;
    if (diff < 60000) el.classList.add("urgent");
  }, 1000);
}

function startPolling() { pollInterval = setInterval(checkPayment, 5000); }

async function checkPayment() {
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/check-payment`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${SUPABASE_ANON}` },
      body: JSON.stringify({ invoice_id: invoiceId })
    });
    if (res.status === 404) {
      showError("Invoice not found."); clearAll(); return;
    }
    const data = await res.json();
    if (data.status === "settled") {
      clearAll();
      showSettled(data.paid_tx_signature || data.invoice?.paid_tx_signature || null);
    } else if (data.status === "expired") {
      clearAll(); showExpired();
    }
  } catch (_) {}
}

function showSettled(sig) {
  setBadge("PAYMENT CONFIRMED", "badge-settled");
  document.getElementById("countdown").textContent = "✓";
  document.getElementById("countdown").classList.remove("urgent");
  const msg = document.getElementById("tx-msg");
  msg.style.display = "block";
  msg.innerHTML = sig
    ? `✅ Payment confirmed!<a href="${PAGE_CONFIG.explorerBaseUrl}${sig}" target="_blank" rel="noopener noreferrer">View on Solscan ↗</a>`
    : `✅ Payment confirmed!`;
  const cta = document.getElementById("open-paypal-btn");
  cta.classList.add("disabled");
  cta.querySelector(".cta-text-top").textContent = "Payment Successful";
  cta.querySelector("#cta-sub").textContent = "Your payment has been confirmed";
}

function showExpired() {
  setBadge("EXPIRED", "badge-expired");
  document.getElementById("countdown").textContent = "00 : 00";
  document.getElementById("countdown").classList.add("urgent");
  const cta = document.getElementById("open-paypal-btn");
  cta.classList.add("disabled");
  cta.querySelector(".cta-text-top").textContent = "Invoice Expired";
  cta.querySelector("#cta-sub").textContent = "Please request a new payment link";
}

function showError(msg) {
  setBadge("ERROR", "badge-expired");
  document.getElementById("display-address").textContent = msg;
  document.getElementById("open-paypal-btn").classList.add("disabled");
}

function setBadge(text, cls) {
  const b = document.getElementById("status-badge");
  b.textContent = text;
  b.className = `status-badge ${cls}`;
}

function clearAll() {
  clearInterval(pollInterval);
  clearInterval(countdownInterval);
}

function copyAddress() {
  const text = document.getElementById("display-address").textContent;
  if (!text || text === "Loading...") return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copy-btn");
    btn.textContent = "✓ Copied!";
    btn.classList.add("copied");
    setTimeout(() => {
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy address`;
      btn.classList.remove("copied");
    }, 2000);
  });
}

loadInvoice();
</script>
</body>
</html>
