<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel · Pay Valentina</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg: #02040a;
      --bg-elevated: #050712;
      --bg-soft: #050816;
      --border-soft: #111827;
      --text-main: #e5e7eb;
      --text-muted: #6b7280;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.16);
      --danger: #f97373;
      --danger-soft: rgba(239, 68, 68, 0.14);
      --warning: #facc15;
      --warning-soft: rgba(250, 204, 21, 0.12);
      --radius-lg: 18px;
      --radius-pill: 999px;
      --shadow-soft: 0 18px 40px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #020617 0, #02040a 40%);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .shell {
      max-width: 520px;
      margin: 0 auto;
      padding: 14px 14px 24px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .hdr-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: radial-gradient(circle at 25% 0, #4ade80, #16a34a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: white;
      box-shadow: 0 12px 24px rgba(22, 163, 74, 0.8);
    }

    .hdr-text {
      display: flex;
      flex-direction: column;
    }

    .hdr-text span:nth-child(1) {
      font-size: 11px;
      color: var(--text-muted);
    }

    .hdr-text span:nth-child(2) {
      font-size: 15px;
      font-weight: 700;
    }

    .hdr-updated {
      font-size: 10px;
      color: #4b5563;
      margin-top: 2px;
    }

    .logout-btn {
      border-radius: var(--radius-pill);
      border: 1px solid rgba(31, 41, 55, 0.9);
      background: linear-gradient(135deg, #0f172a, #020617);
      color: #f9fafb;
      font-size: 12px;
      padding: 7px 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
      font-family: inherit;
    }

    .logout-btn span.icon {
      width: 16px;
      height: 16px;
      border-radius: 7px;
      background: rgba(15, 23, 42, 0.9);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: radial-gradient(circle at top, #020617, #050712);
      border-radius: 18px;
      padding: 10px 12px;
      border: 1px solid rgba(31, 41, 55, 0.9);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .stat-label span.dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .stat-sub {
      font-size: 11px;
      color: #9ca3af;
    }

    .stat--earnings { border-color: rgba(59, 130, 246, 0.7); }
    .stat--earnings .stat-label span.dot { background: #38bdf8; }
    .stat--earnings .stat-value { color: #38bdf8; }

    .stat--pending {
      border-color: rgba(250, 204, 21, 0.6);
      background: radial-gradient(circle at top, #111827, #020617);
    }
    .stat--pending .stat-label span.dot { background: #facc15; }

    .stat--total { border-color: rgba(148, 163, 184, 0.7); }
    .stat--total .stat-label span.dot { background: #9ca3af; }

    /* Tabs */
    .tabs {
      display: flex;
      margin-bottom: 10px;
      padding: 2px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(31, 41, 55, 0.9);
    }

    .tab-btn {
      flex: 1;
      border-radius: 999px;
      border: none;
      padding: 7px 0;
      font-size: 12px;
      color: var(--text-muted);
      background: transparent;
      cursor: pointer;
      transition: all 0.15s ease-out;
      font-family: inherit;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      box-shadow: 0 12px 30px rgba(22, 163, 74, 0.9);
    }

    /* Filters row */
    .filters-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .select {
      flex: 1;
      position: relative;
    }

    .select select {
      width: 100%;
      border-radius: 999px;
      border: 1px solid rgba(31, 41, 55, 0.9);
      background: #020617;
      color: var(--text-main);
      font-size: 11px;
      padding: 7px 24px 7px 10px;
      appearance: none;
      font-family: inherit;
    }

    .select::after {
      content: "▾";
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: #6b7280;
      pointer-events: none;
    }

    .refresh-btn {
      flex: 0 0 auto;
      border-radius: 999px;
      border: 1px solid rgba(34, 197, 94, 0.8);
      background: rgba(22, 163, 74, 0.08);
      color: #bbf7d0;
      font-size: 11px;
      padding: 7px 11px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }

    .refresh-btn:hover { background: rgba(22, 163, 74, 0.18); }
    .refresh-btn.spinning { animation: spin 0.8s linear infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Search */
    .search-row {
      margin-bottom: 8px;
      display: flex;
      gap: 8px;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
    }

    .search-input-wrap input {
      width: 100%;
      border-radius: 999px;
      border: 1px solid rgba(31, 41, 55, 0.9);
      background: #020617;
      color: var(--text-main);
      font-size: 11px;
      padding: 7px 10px 7px 24px;
      font-family: inherit;
    }

    .search-input-wrap span.icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 10px;
      color: #6b7280;
    }

    /* List */
    .list {
      border-radius: 18px;
      border: 1px solid rgba(31, 41, 55, 0.9);
      background: #020617;
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.7);
      padding: 6px 0 2px;
      min-height: 60px;
    }

    .list-empty {
      padding: 24px 16px;
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }

    .list-loading {
      padding: 24px 16px;
      font-size: 12px;
      color: #4b5563;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(34,197,94,0.2);
      border-top-color: #22c55e;
      border-radius: 999px;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }

    .item {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .item + .item {
      border-top: 1px solid rgba(15, 23, 42, 1);
    }

    .item-main {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }

    .item-amount {
      font-size: 14px;
      font-weight: 700;
    }

    .item-meta {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta span.dot {
      display: inline-block;
      width: 3px;
      height: 3px;
      border-radius: 999px;
      background: #4b5563;
      margin: 0 4px;
      vertical-align: middle;
    }

    .item-tags {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 10px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      background: #020617;
      color: #9ca3af;
    }

    .pill-app { background: rgba(15, 23, 42, 1); }

    .pill-app.cashapp { border-color: rgba(34, 197, 94, 0.8); color: #bbf7d0; }
    .pill-app.paypal  { border-color: rgba(59, 130, 246, 0.8); color: #bfdbfe; }
    .pill-app.venmo   { border-color: rgba(56, 189, 248, 0.8); color: #e0f2fe; }

    .pill-status.expired {
      border-color: rgba(239, 68, 68, 0.8);
      background: var(--danger-soft);
      color: #fecaca;
    }

    .pill-status.paid {
      border-color: rgba(34, 197, 94, 0.8);
      background: var(--accent-soft);
      color: #bbf7d0;
    }

    .pill-status.pending {
      border-color: rgba(250, 204, 21, 0.6);
      background: rgba(250, 204, 21, 0.08);
      color: #fef08a;
    }

    .item-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .item-country {
      font-size: 11px;
      color: #6b7280;
      max-width: 120px;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-chevron {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #9ca3af;
    }

    /* Error banner */
    .error-banner {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5;
      border-radius: 12px;
      font-size: 11px;
      padding: 10px 14px;
      margin-bottom: 10px;
      display: none;
    }

    @media (max-width: 420px) {
      .shell { padding-inline: 10px; }
      .stats-grid { gap: 8px; }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="shell">

    <!-- Header -->
    <header>
      <div class="hdr-left">
        <div class="avatar">S</div>
        <div class="hdr-text">
          <span>Admin Panel</span>
          <span>Sophia</span>
          <span class="hdr-updated" id="hdr-updated">Updating...</span>
        </div>
      </div>
      <button class="logout-btn" type="button" onclick="onLogout()">
        <span class="icon">⏻</span>
        <span>Logout</span>
      </button>
    </header>

    <!-- Error banner -->
    <div class="error-banner" id="error-banner"></div>

    <!-- Stats -->
    <section class="stats-grid">
      <article class="stat-card">
        <div class="stat-label">
          <span class="dot"></span>
          <span>Total Settled</span>
        </div>
        <div class="stat-value" id="stat-total-settled">—</div>
        <div class="stat-sub" id="stat-total-settled-sub">— payments</div>
      </article>

      <article class="stat-card stat--earnings">
        <div class="stat-label">
          <span class="dot"></span>
          <span>Today's earnings</span>
        </div>
        <div class="stat-value" id="stat-today-earnings">—</div>
        <div class="stat-sub" id="stat-today-earnings-sub">— today</div>
      </article>

      <article class="stat-card stat--pending">
        <div class="stat-label">
          <span class="dot"></span>
          <span>Pending</span>
        </div>
        <div class="stat-value" id="stat-pending">—</div>
        <div class="stat-sub">Awaiting payment</div>
      </article>

      <article class="stat-card stat--total">
        <div class="stat-label">
          <span class="dot"></span>
          <span>Total payments</span>
        </div>
        <div class="stat-value" id="stat-total-payments">—</div>
        <div class="stat-sub" id="stat-total-payments-sub">— expired</div>
      </article>
    </section>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-payments" type="button" onclick="switchTab('payments')">
        💳 Payments
      </button>
      <button class="tab-btn" id="tab-withdrawals" type="button" onclick="switchTab('withdrawals')">
        💸 Withdrawals
      </button>
    </div>

    <!-- Filters -->
    <div class="filters-row">
      <div class="select">
        <select id="filter-status" onchange="applyFilters()">
          <option value="all">All Status</option>
          <option value="paid">Paid</option>
          <option value="pending">Pending</option>
          <option value="expired">Expired</option>
        </select>
      </div>
      <div class="select">
        <select id="filter-range" onchange="applyFilters()">
          <option value="all">All Time</option>
          <option value="today">Today</option>
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
        </select>
      </div>
      <button class="refresh-btn" id="refresh-btn" type="button" onclick="onRefresh()">
        ⟳ Refresh
      </button>
    </div>

    <!-- Search -->
    <div class="search-row">
      <div class="search-input-wrap">
        <span class="icon">🔍</span>
        <input id="search-input" type="text" placeholder="Search invoice ID..." oninput="applyFilters()" />
      </div>
    </div>

    <!-- Payments List -->
    <section class="list" id="list-payments">
      <div class="list-loading">
        <span class="spinner"></span> Loading payments...
      </div>
    </section>

    <!-- Withdrawals List -->
    <section class="list" id="list-withdrawals" style="display:none">
      <div class="list-empty">No withdrawals yet.</div>
    </section>

  </div>
</div>

<script>
  // ─── Supabase Client ──────────────────────────────────────────────
  const SUPABASE_URL     = "https://ouecuohshzyefyxhjahn.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91ZWN1b2hzaHp5ZWZ5eGhqYWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMDEyMTEsImV4cCI6MjA5Njc3NzIxMX0.S6wv2qiwamD8XQ98IYST4omRBzTubq8XCIpdfmRkp6k";
  const sb = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ─── Helpers ──────────────────────────────────────────────────────
  function fmt$(n) {
    return "$" + Number(n || 0).toFixed(2);
  }

  function fmtDate(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleString("en-US", {
      month: "short", day: "2-digit",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function appLabel(app) {
    return app === "cashapp" ? "Cash App"
         : app === "paypal"  ? "PayPal"
         : app === "venmo"   ? "Venmo"
         : app || "Unknown";
  }

  function showError(msg) {
    const el = document.getElementById("error-banner");
    if (msg) { el.textContent = "⚠️ " + msg; el.style.display = "block"; }
    else { el.style.display = "none"; }
  }

  function setUpdatedTime() {
    const now = new Date();
    document.getElementById("hdr-updated").textContent =
      "Updated " + now.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
  }

  // ─── Fetch: Stats ────────────────────────────────────────────────
  async function fetchStats() {
    // Pull all rows once, compute stats client-side (small dataset)
    const { data, error } = await sb
      .from("payments")
      .select("amount_usd, status, created_at");

    if (error) throw error;
    const rows = data || [];

    const todayStr = new Date().toISOString().slice(0, 10);

    const paid    = rows.filter(r => r.status === "paid");
    const today   = paid.filter(r => (r.created_at || "").startsWith(todayStr));
    const pending = rows.filter(r => r.status === "pending");
    const expired = rows.filter(r => r.status === "expired");

    return {
      totalSettledAmount : paid.reduce((s, r) => s + Number(r.amount_usd || 0), 0),
      totalSettledCount  : paid.length,
      todayAmount        : today.reduce((s, r) => s + Number(r.amount_usd || 0), 0),
      todayCount         : today.length,
      pendingCount       : pending.length,
      totalCount         : rows.length,
      expiredCount       : expired.length,
    };
  }

  function updateStats(s) {
    document.getElementById("stat-total-settled").textContent     = fmt$(s.totalSettledAmount);
    document.getElementById("stat-total-settled-sub").textContent = s.totalSettledCount + " payments";
    document.getElementById("stat-today-earnings").textContent    = fmt$(s.todayAmount);
    document.getElementById("stat-today-earnings-sub").textContent= s.todayCount + " today";
    document.getElementById("stat-pending").textContent           = s.pendingCount;
    document.getElementById("stat-total-payments").textContent    = s.totalCount;
    document.getElementById("stat-total-payments-sub").textContent= s.expiredCount + " expired";
  }

  // ─── Fetch: Payments list ────────────────────────────────────────
  async function fetchPayments({ status = "all", range = "all" } = {}) {
    let q = sb
      .from("payments")
      .select("id, invoice_code, amount_usd, currency, app, status, country, created_at")
      .order("created_at", { ascending: false });

    if (status !== "all") q = q.eq("status", status);

    if (range === "today") {
      q = q.gte("created_at", new Date().toISOString().slice(0, 10) + "T00:00:00Z");
    } else if (range === "7d") {
      q = q.gte("created_at", new Date(Date.now() - 7  * 864e5).toISOString());
    } else if (range === "30d") {
      q = q.gte("created_at", new Date(Date.now() - 30 * 864e5).toISOString());
    }

    const { data, error } = await q;
    if (error) throw error;

    return (data || []).map(r => ({
      id         : r.invoice_code || r.id,
      amount     : Number(r.amount_usd || 0),
      currency   : r.currency || "USD",
      app        : r.app,
      status     : r.status,
      createdAt  : fmtDate(r.created_at),
      country    : r.country || "",
      methodLabel: appLabel(r.app),
    }));
  }

  // ─── Render: Payment list ────────────────────────────────────────
  function renderPayments(list) {
    const el = document.getElementById("list-payments");
    if (!list.length) {
      el.innerHTML = '<div class="list-empty">No payments found.</div>';
      return;
    }
    el.innerHTML = list.map(p => `
      <div class="item">
        <div class="item-main">
          <div class="item-amount">${fmt$(p.amount)}</div>
          <div class="item-meta">
            <span>${p.createdAt}</span>
            <span class="dot"></span>
            <span>${p.id}</span>
          </div>
          <div class="item-tags">
            <span class="pill pill-app ${p.app}">${p.methodLabel}</span>
            <span class="pill pill-status ${p.status}">${p.status.toUpperCase()}</span>
          </div>
        </div>
        <div class="item-right">
          <div class="item-country">${p.country}</div>
          <div class="item-chevron">›</div>
        </div>
      </div>
    `).join("");
  }

  // ─── Tab / filter / search ────────────────────────────────────────
  let currentTab = "payments";

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById("tab-payments").classList.toggle("active", tab === "payments");
    document.getElementById("tab-withdrawals").classList.toggle("active", tab === "withdrawals");
    document.getElementById("list-payments").style.display    = tab === "payments"    ? "block" : "none";
    document.getElementById("list-withdrawals").style.display = tab === "withdrawals" ? "block" : "none";
  }

  async function applyFilters() {
    const status = document.getElementById("filter-status").value;
    const range  = document.getElementById("filter-range").value;
    const search = document.getElementById("search-input").value.trim().toLowerCase();

    try {
      let payments = await fetchPayments({ status, range });
      if (search) payments = payments.filter(p => p.id.toLowerCase().includes(search));
      renderPayments(payments);
      showError(null);
    } catch (e) {
      showError("Failed to load payments: " + (e.message || e));
    }
  }

  // ─── Load initial (stats + list) ─────────────────────────────────
  async function loadInitial() {
    try {
      const [stats, payments] = await Promise.all([
        fetchStats(),
        fetchPayments()
      ]);
      updateStats(stats);
      renderPayments(payments);
      setUpdatedTime();
      showError(null);
    } catch (e) {
      showError("Supabase error: " + (e.message || e));
      document.getElementById("list-payments").innerHTML =
        '<div class="list-empty">Could not load data. Check console.</div>';
      console.error(e);
    }
  }

  async function onRefresh() {
    const btn = document.getElementById("refresh-btn");
    btn.textContent = "⟳";
    btn.classList.add("spinning");
    await loadInitial();
    btn.textContent = "⟳ Refresh";
    btn.classList.remove("spinning");
  }

  function onLogout() {
    if (confirm("Log out?")) {
      window.location.href = "/";
    }
  }

  // ─── Auto-refresh every 30 seconds ───────────────────────────────
  loadInitial();
  setInterval(loadInitial, 30000);
</script>
</body>
</html>
