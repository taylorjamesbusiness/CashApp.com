<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Invoice · Pay Valentina · Cash App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:20px;padding:32px 24px;max-width:420px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,.10)}
.logo{text-align:center;margin-bottom:16px}
h1{text-align:center;font-size:1.15rem;font-weight:700;color:#111;margin-bottom:4px}
.sub{text-align:center;color:#888;font-size:.85rem;margin-bottom:22px;font-family:monospace}
.amount-box{background:#00D64F15;border-radius:14px;padding:18px;text-align:center;margin-bottom:20px}
.amount-box .amt{font-size:2.4rem;font-weight:800;color:#00D64F}
.amount-box .lbl{font-size:.8rem;color:#999;margin-top:3px}
.qr-wrap{text-align:center;margin-bottom:18px}
.qr-wrap img{width:176px;height:176px;border-radius:12px;border:1px solid #eee}
.addr-box{background:#f8f8f8;border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:10px;margin-bottom:20px}
.addr-box span{font-size:.73rem;color:#555;flex:1;word-break:break-all;font-family:monospace;line-height:1.4}
.copy-btn{background:#00D64F;color:#fff;border:none;border-radius:8px;padding:7px 13px;font-size:.8rem;cursor:pointer;white-space:nowrap;font-weight:600}
.status-box{border-radius:12px;padding:14px;text-align:center;font-weight:600;font-size:.95rem;margin-bottom:16px}
.waiting{background:#fff8e1;color:#b8860b;border:1px solid #ffe082}
.paid{background:#e8f5e9;color:#1b5e20;border:1px solid #a5d6a7}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid #00D64F40;border-top-color:#00D64F;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.meta{text-align:center;font-size:.72rem;color:#ccc;line-height:1.8}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 22px;border-radius:30px;font-size:.84rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.loading-msg{text-align:center;color:#aaa;font-size:.9rem;padding:30px 0}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><svg width="52" height="52" viewBox="0 0 52 52"><rect width="52" height="52" rx="13" fill="#00D64F"/><text x="26" y="35" font-size="26" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">$</text></svg></div>
  <h1>Pay Valentina</h1>
  <p class="sub" id="inv-code">Loading...</p>
  <div id="loading-state" class="loading-msg">⏳ Creating invoice...</div>
  <div id="main-content" style="display:none">
    <div class="amount-box">
      <div class="amt" id="amt">$--</div>
      <div class="lbl">USDC · Solana</div>
    </div>
    <div class="qr-wrap"><img id="qr" src="" alt="QR Code"/></div>
    <div class="addr-box" onclick="copyAddr()">
      <span id="addr">--</span>
      <button class="copy-btn">Copy</button>
    </div>
    <div class="status-box waiting" id="status-box">
      <span class="spinner" id="spinner"></span>
      <span id="status-txt">Waiting for payment...</span>
    </div>
    <div class="meta" id="meta-info"></div>
  </div>
</div>
<div class="toast" id="toast">✓ Copied!</div>
<script>
const SUPA='https://ouecuohshzyefyxhjahn.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im91ZWN1b2hzaHp5ZWZ5eGhqYWhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk2NjgwMTEsImV4cCI6MjA2NTI0NDAxMX0.aSvMrOBHpH4PmqSUPsT4PKbIZDtGBLPKFAeM0nOo7s8';
const APP='cashapp';
const WALLET='Bk6HHmSVYwM3veHS9LpWq2TvGKjah9jmuBhCyrGu2TNa';
const params=new URLSearchParams(location.search);
const urlAmt=parseFloat(params.get('amount')||'0');
let invoiceCode=null,pollTimer=null;
async function init(){
  try{
    const res=await fetch(`${SUPA}/functions/v1/create-payment`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:urlAmt,app:APP})});
    const data=await res.json();
    if(!data.success||!data.invoice_code){showError('Failed: '+(data.error||'Unknown'));return;}
    invoiceCode=data.invoice_code;
    history.replaceState(null,'',location.pathname+'?id='+invoiceCode+'&amount='+urlAmt+'&app='+APP);
    document.getElementById('inv-code').textContent=invoiceCode;
    document.getElementById('amt').textContent='$'+urlAmt.toFixed(2);
    document.getElementById('addr').textContent=WALLET;
    document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=176x176&data='+encodeURIComponent(WALLET);
    document.getElementById('meta-info').textContent='Invoice expires in 60 min';
    document.getElementById('loading-state').style.display='none';
    document.getElementById('main-content').style.display='block';
    pollTimer=setInterval(checkPayment,15000);
    checkPayment();
  }catch(err){showError('Network error: '+err.message);}
}
async function checkPayment(){
  if(!invoiceCode)return;
  try{
    const res=await fetch(`${SUPA}/functions/v1/check-payment`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({invoice_id:invoiceCode,app:APP})});
    const data=await res.json();
    if(data.status==='paid'||data.success===true){clearInterval(pollTimer);showPaid();}
  }catch(_){}
}
function showPaid(){
  document.getElementById('spinner').style.display='none';
  document.getElementById('status-box').className='status-box paid';
  document.getElementById('status-txt').textContent='✅ Payment Received!';
  document.getElementById('meta-info').textContent='Thank you! Payment confirmed.';
}
function showError(msg){document.getElementById('loading-state').textContent='❌ '+msg;}
function copyAddr(){
  navigator.clipboard.writeText(WALLET).then(()=>{
    const t=document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
  });
}
init();
</script>
</body>
</html>
