<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Dashboard Debug</title>

<!-- Supabase CDN -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
body{margin:0;font-family:sans-serif;background:#000;color:#fff;}
.container{max-width:1100px;margin:auto;padding:20px;}
.card{background:#111;padding:15px;border-radius:10px;margin-bottom:15px;}
button{padding:10px 15px;border:none;border-radius:6px;cursor:pointer; font-weight:bold;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="container">
  <div class="card">
    <h2>🌍 Master Login (Diagnostic)</h2>
    <input id="email" placeholder="Email" style="width:100%;padding:10px;margin-bottom:10px;box-sizing:border-box;">
    <input id="pass" type="password" placeholder="Password" style="width:100%;padding:10px;margin-bottom:10px;box-sizing:border-box;">
    <button onclick="login()" id="loginBtn" style="background:#3b82f6;color:white;width:100%;">Click to Login</button>
  </div>
</div>

<div id="dashboard" class="container" style="display:none;">
  <h2>Dashboard Loaded Successfully!</h2>
  <button onclick="logout()" style="background:#ef4444;color:white;">Logout</button>
</div>

<script>
// 🚨 ১. MOBILE ERROR CATCHER: কোড ক্র্যাশ করলে স্ক্রিনে ভাসবে!
window.onerror = function(msg, url, lineNo, columnNo, error) {
  alert("🚨 System Error: " + msg + "\n\nLine: " + lineNo);
  document.getElementById('loginBtn').innerText = "System Crashed!";
  return false;
};

let supabase;

// 🚨 ২. DELAYED INIT: পেজ লোড হওয়ার পর চেক করবে Supabase ব্লক কিনা
setTimeout(() => {
  if (typeof window.supabase === 'undefined') {
    alert("⚠️ INTERNET BLOCK DETECTED!\n\nআপনার ইন্টারনেট (বা WiFi) Supabase এর ফাইলগুলো ব্লক করে রেখেছে। দয়া করে একটি VPN চালু করে পেজটি রিলোড দিন।");
    document.getElementById('loginBtn').innerText = "Blocked by ISP - Use VPN";
    document.getElementById('loginBtn').style.background = "#ef4444";
  } else {
    // যদি ব্লক না থাকে, তাহলে ইনিশিয়ালাইজ করবে
    try {
      supabase = window.supabase.createClient(
        "https://qhyimqvuzzanekcqaemg.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoeWltcXZ1enphbmVrY3FhZW1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyODQ0NTgsImV4cCI6MjA5Nzg2MDQ1OH0.9_N1k4KhmK0Q9biy1SBOo6bvHsZEbTsyaPLz1t1k-R0"
      );
      
      // Session Listener
      supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
          document.getElementById('loginPage').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
        } else {
          document.getElementById('loginPage').style.display = 'block';
          document.getElementById('dashboard').style.display = 'none';
        }
      });
      
    } catch(e) {
      alert("Init Error: " + e.message);
    }
  }
}, 800); // ৮০০ মিলিসেকেন্ড অপেক্ষা করবে ফাইল লোড হওয়ার জন্য

// ✅ LOGIN FUNCTION
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('pass').value;
  const btn = document.getElementById('loginBtn');

  if(!email || !password) return alert("Please enter email and password");

  if (!supabase) {
    return alert("Supabase is not loaded. Turn on VPN and refresh.");
  }

  btn.innerText = "Authenticating...";

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      alert("Login Failed: " + error.message);
      btn.innerText = "Click to Login";
    }
  } catch(e) {
    alert("Login Crash: " + e.message);
    btn.innerText = "Click to Login";
  }
}

async function logout(){
  if(supabase) await supabase.auth.signOut();
}
</script>

</body>
</html>
